name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Rust tests
  rust-test:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      # Keep the pinned Rust version in sync with rust-toolchain.toml.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install protobuf/flatbuffer compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf flatbuffers
          protoc --version

      - name: Install flatc
        if: runner.os == 'Linux'
        run: |
          curl -sSL "https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.clang++-18.zip" -o /tmp/flatc.zip
          sudo unzip -o /tmp/flatc.zip flatc -d /usr/local/bin
          sudo chmod +x /usr/local/bin/flatc
          flatc --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Is Cargo.lock consistent with Cargo.toml?
        run: cargo fetch --locked

      - name: Run cargo fmt check
        run: cargo fmt --all -- --check

      - name: Run cargo check
        run: cargo check

      - name: Run cargo check (explicitly without dynamic-inputs)
        run: cargo check --no-default-features

      - name: Run cargo check (onnx-runtime without dynamic-inputs)
        run: cargo check --no-default-features --features onnx-runtime

      - name: Run cargo check (TensorRT)
        run: cargo check -F trtx-runtime --all-targets

      - name: Run cargo check (LiteRT)
        run: cargo check --features litert-runtime

      - name: Build wasm32
        run: |
          make fetch-wpt # browser wasm32 can't read files, therefore wpt spec is baked into test wasm32
          RUSTFLAGS="-C target-feature=+reference-types --cfg=web_sys_unstable_apis" cargo check --target wasm32-unknown-unknown -F webnn-runtime,webnn-wpt-tests --all-targets
          RUSTFLAGS="-C target-feature=+reference-types --cfg=web_sys_unstable_apis" cargo check --target wasm32-unknown-unknown --no-default-features -F webnn-runtime

      - name: Run cargo check (CANN runtime)
        run: cargo check --features cann-runtime

      - name: Run cargo check (CoreML)
        if: runner.os == 'macOS'
        run: cargo check --features coreml-runtime

      - name: Run cargo test (library only)
        run: cargo test --lib

      - name: Run cargo test (library only, CoreML)
        if: runner.os == 'macOS'
        run: cargo test --lib --features coreml-runtime

      - name: Run cargo test (library only, CANN mock)
        run: cargo test --lib --features cann-runtime-mock

      - name: Check backend operator report is up to date
        if: runner.os == 'Linux'
        run: |
          python3 scripts/generate_backend_operator_report.py --check

      - name: Run backend operator report parser tests
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest scripts/test_generate_backend_operator_report.py

  docs-test:
    name: Test Documentation Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build documentation
        run: mkdocs build --strict

  # Check that version in pyproject.toml matches git tag (for releases)
  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$TAG" != "$VERSION" ]; then
            echo "Error: Tag version ($TAG) does not match pyproject.toml version ($VERSION)"
            exit 1
          fi
          echo "Version check passed: $VERSION"
