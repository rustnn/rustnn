name: Build and Deploy Documentation

# The published site combines four generated parts:
# - MkDocs pages from docs/ (mkdocs.yml)
# - C and C++ API docs from Doxygen, embedded at /c-api/ by the MkDocs hook
# - Rust API docs from rustdoc, embedded at /api/ (make docs-api)
# - the WPT conformance dashboard cached by the nightly workflow, embedded at /wpt-conformance/
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "Doxyfile"
      - "cbindgen.toml"
      - "assets/capi/include/**"
      - "scripts/build_capi_docs.py"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "Makefile"
      - ".github/workflows/docs.yml"
      - "scripts/embed_wpt_conformance_pages.sh"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "Doxyfile"
      - "cbindgen.toml"
      - "assets/capi/include/**"
      - "scripts/build_capi_docs.py"
      - "scripts/embed_wpt_conformance_pages.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Keep the pinned Rust version and components in sync with rust-toolchain.toml. Installing
      # the components here avoids the implicit rustup sync on the first cargo call, which has
      # failed with a component file conflict.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy, rust-src

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler doxygen
          protoc --version

      - name: Install flatc
        run: |
          curl -sSL "https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.clang++-18.zip" -o /tmp/flatc.zip
          sudo unzip -o /tmp/flatc.zip flatc -d /usr/local/bin
          sudo chmod +x /usr/local/bin/flatc
          flatc --version

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-docs-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.4 --locked

      - name: Build documentation
        run: mkdocs build --strict --verbose

      - name: Build Rust API documentation
        run: make docs-api

      - name: Embed Rust API documentation
        run: cp -r target/doc site/api

      - name: Restore published WPT conformance report
        # The nightly saves one immutable cache entry per run; the exact key never
        # matches, and the prefix restores the most recently created report.
        uses: actions/cache/restore@v4
        with:
          path: reports
          key: wpt-conformance-pages-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            wpt-conformance-pages-${{ runner.os }}-

      - name: Embed WPT conformance report
        run: bash scripts/embed_wpt_conformance_pages.sh site

      - name: Create .nojekyll file
        run: touch site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'workflow_dispatch' ) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
