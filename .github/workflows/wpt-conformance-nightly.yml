name: Nightly WPT Conformance Pages

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build WPT report and deploy docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install flatc
        run: |
          curl -sSL "https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.clang++-18.zip" -o /tmp/flatc.zip
          sudo unzip -o /tmp/flatc.zip flatc -d /usr/local/bin
          sudo chmod +x /usr/local/bin/flatc
          flatc --version

      - name: Install MkDocs dependencies
        run: pip install -r docs/requirements.txt

      - name: Cache WPT checkout
        uses: actions/cache@v4
        with:
          path: .cache/wpt
          key: wpt-${{ runner.os }}-${{ hashFiles('scripts/fetch_wpt.mjs') }}
          restore-keys: |
            wpt-${{ runner.os }}-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-wpt-nightly-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run WPT conformance and generate reports
        env:
          WPT_REPORT_JSON: reports/wpt-conformance.json
          RUSTNN_GIT_SHA: ${{ github.sha }}
          RUSTNN_GIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: make test-wpt-report || true

      - name: Save WPT conformance report for doc deploys
        # Cache entries are immutable: a fixed key is written once and every later save
        # fails, so docs deploys would republish the first report forever. Save under a
        # per-run key; docs.yml and docs-pr.yml restore the newest entry by prefix.
        if: hashFiles('reports/wpt-conformance.html') != ''
        uses: actions/cache/save@v4
        with:
          path: reports
          key: wpt-conformance-pages-${{ runner.os }}-${{ github.run_id }}

      - name: Build documentation site
        run: mkdocs build --strict --verbose

      - name: Build Rust API documentation
        run: make docs-api

      - name: Embed Rust API documentation
        run: cp -r target/doc site/api

      - name: Embed WPT conformance report
        run: bash scripts/embed_wpt_conformance_pages.sh site

      - name: Create .nojekyll file
        run: touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # Forks usually do not enable GitHub Pages, and deploy-pages fails there with a 404.
      # Deploy only when the repository publishes Pages from GitHub Actions; any other API
      # error still fails the job, so a real deployment problem is not skipped silently.
      - name: Check GitHub Pages source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>"$RUNNER_TEMP/pages.err"); then
            echo "GitHub Pages build type: $build_type"
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/pages.err"; then
            build_type=none
          else
            cat "$RUNNER_TEMP/pages.err" >&2
            exit 1
          fi
          if [ "$build_type" = workflow ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping the deployment: GitHub Pages for $GITHUB_REPOSITORY is not set to deploy from GitHub Actions (build type: $build_type)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
