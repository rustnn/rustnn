name: WPT Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  wpt-conformance:
    name: ${{ matrix.backend.label }}
    strategy:
      fail-fast: false
      matrix:
        backend:
          - id: onnx
            label: ONNX
            continue_on_error: false
            os: ubuntu-latest
          - id: burn-cpu
            label: Burn CPU
            continue_on_error: false
            os: ubuntu-latest
          - id: litert
            label: LiteRT
            continue_on_error: true
            os: ubuntu-latest
          - id: coreml
            label: CoreML
            continue_on_error: false
            os: macos-latest
    runs-on: ${{ matrix.backend.os }}
    continue-on-error: ${{ matrix.backend.continue_on_error }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Install protobuf compiler
        if: runner.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install protobuf/flatbuffer compiler
        if: runner.os == 'macOS'
        run: |
          brew install protobuf flatbuffers
          protoc --version


      - name: Install flatc
        if: matrix.backend.id == 'litert'
        run: |
          curl -sSL "https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.clang++-18.zip" -o /tmp/flatc.zip
          sudo unzip -o /tmp/flatc.zip flatc -d /usr/local/bin
          sudo chmod +x /usr/local/bin/flatc
          flatc --version

      - name: Cache WPT checkout
        uses: actions/cache@v4
        with:
          path: .cache/wpt
          key: wpt-${{ runner.os }}-${{ hashFiles('scripts/fetch_wpt.mjs') }}
          restore-keys: |
            wpt-${{ runner.os }}-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          # Cargo can reuse litert-sys build-script output without downloading
          # its libraries again. Restore both together to keep linker paths valid.
          path: |
            target
            ${{ matrix.backend.id == 'litert' && '~/.cache/litert-sys' || '' }}
          key: ${{ runner.os }}-${{ runner.arch }}-wpt-${{ matrix.backend.id }}-cargo-v2-${{ hashFiles('Cargo.lock') }}

      - name: Fetch WPT corpus
        run: node scripts/fetch_wpt.mjs

      - name: Run WPT conformance tests
        if: matrix.backend.id != 'burn-cpu'
        env:
          RUSTNN_GIT_SHA: ${{ github.sha }}
          RUSTNN_GIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: make test-wpt-report WPT_BACKEND=${{ matrix.backend.id }}

      - name: Run Burn CPU WPT conformance tests
        if: matrix.backend.id == 'burn-cpu'
        env:
          WPT_BACKEND: burn-cpu
          WPT_STRICT_REVISION: '1'
          WPT_REPORT_JSON: reports/wpt-conformance.json
          RUSTNN_GIT_SHA: ${{ github.sha }}
          RUSTNN_GIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          mkdir -p reports
          cargo test --locked --release --features burn-runtime-cpu --test run_wpt_conformance -- --test-threads 1

      - name: Upload WPT conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.backend.id }}-wpt-conformance-report
          path: reports/wpt-conformance.json

      - name: Upload WPT conformance HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.backend.id }}-wpt-conformance-html-report
          path: reports/wpt-conformance.html


