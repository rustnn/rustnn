site_name: RustNN
site_description: Rust implementation of the W3C WebNN API
site_author: Tarek Ziadé and contributors
site_url: https://rustnn.github.io/rustnn/

repo_name: rustnn/rustnn
repo_url: https://github.com/rustnn/rustnn
edit_uri: edit/main/docs/

theme:
  name: material
  logo: logo/rustnn.png
  favicon: logo/rustnn.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

# Exclude files from the docs site. docs/archive holds superseded plans and
# investigation notes that reference removed APIs; they are kept for history only.
exclude_docs: |
  README.md
  archive/

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide:
      - Getting Started: user-guide/getting-started.md
      - API Overview: user-guide/api-reference.md
      - Backends: user-guide/backends.md
      - Examples: user-guide/examples.md
      - Advanced Topics: user-guide/advanced.md
      - Troubleshooting: user-guide/troubleshooting.md
      - Rust API Reference (rustdoc): https://rustnn.github.io/rustnn/api/rustnn/
  - Architecture:
      - Overview: architecture/overview.md
  - Development:
      - Setup and Workflow: development/setup.md
      - Converter Internals: development/converters.md
      - Documentation Policy: development/documentation-policy.md
      - Implementation Status: development/implementation-status.md
      - Backend Operator Support: development/backend-operator-support.md
      - Flexible Input Shapes: development/flexible-input-shapes.md
      - Code Coverage: development/code-coverage.md
  - Testing:
      - WPT Conformance Guide: testing/wpt-test-guide.md
      - WPT Conformance Dashboard: https://rustnn.github.io/rustnn/wpt-conformance/
  - Integration:
      - TensorRT-RTX: integration/tensorrt.md
      - Windows TensorRT-RTX Setup: integration/windows-tensorrt-setup.md
      - CoreML: integration/coreml.md
      - LiteRT: integration/litert.md
      - CANN (OpenHarmony): integration/cann.md
      - Browser WebNN (wasm32): integration/webnn-browser.md
  - Reference:
      - WebNN Specification and rustnn: reference/webnn-spec.md
      - Graph Files and Weights: reference/graph-files.md
      - WebNN Operators Explained: reference/operators-explanation.md
      - IPC Design Notes: reference/ipc-design.md
      - Changelog: https://github.com/rustnn/rustnn/blob/main/CHANGELOG.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rustnn/rustnn
  version:
    provider: mike

copyright: Copyright &copy; 2025 Tarek Ziadé
