[package]
name = "rustnn"
version = "0.5.11"
edition = "2024"
description = "W3C WebNN implementation with ONNX, CoreML, and TensorRT backends [DO NOT USE IN PRODUCTION - Development Release]"
license = "Apache-2.0"
repository = "https://github.com/rustnn/rustnn"
keywords = ["webnn", "onnx", "coreml", "tensorrt", "neural-networks"]
categories = ["science", "api-bindings"]
exclude = [
    "site/*",
    "docs/*",
    "tests/*",
    "examples/*",
    ".github/*",
    "*.md",
    "!README.md",
]

[features]
default = []
dynamic-inputs = []
coreml-converter = ["dep:prost", "dep:prost-types", "dep:prost-build"]
coreml-runtime = ["objc", "coreml-converter"]
onnx-runtime = [
    "ort",
    "ndarray",
    "dep:tempfile",
    "dep:webnn-onnx-utils",
    "dep:prost",
    "dep:prost-types",
]
trtx-runtime = ["trtx", "cudarc"]
trtx-runtime-mock = ["trtx/mock", "cudarc"]
burn-plan = ["dep:postcard"]
burn-runtime-cpu = ["burn-plan", "dep:burn", "dep:burn-ndarray"]
burn-runtime-webgpu = [
    "burn-plan",
    "dep:burn",
    "dep:burn-wgpu",
    "dep:burn-ndarray",
    "dep:futures-lite",
    "dep:wgpu",
]
burn-runtime = ["burn-runtime-cpu", "burn-runtime-webgpu"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.8", features = ["base64"] }
thiserror = "1.0"
base64 = "0.22"
prost = { version = "0.12", optional = true }
prost-types = { version = "0.12", optional = true }
bytes = "1.6"
bytemuck = { version = "1.15", features = ["extern_crate_std"] }
ndarray = { version = "0.17", optional = true }
objc = { version = "0.2", optional = true }
tempfile = { version = "3.8", optional = true }
ort = { version = "=2.0.0-rc.12", optional = true, features = [
    "ndarray",
    "half",
    "load-dynamic",
    "api-24",
] }
half = "2.4"
trtx = { version = "0.6.0", optional = true }
regex = "1.11"
webnn-graph = { git = "https://github.com/rustnn/webnn-graph", branch = "main", default-features = false }
webnn-onnx-utils = { git = "https://github.com/rustnn/webnn-onnx-utils", branch = "main", optional = true }
postcard = { version = "1", optional = true, features = ["alloc"] }
burn = { version = "0.21", optional = true, default-features = false, features = ["std"] }
burn-ndarray = { version = "0.21", optional = true }
burn-wgpu = { version = "0.21", optional = true }
futures-lite = { version = "2", optional = true }
wgpu = { version = "29", optional = true }

cudarc = { version = "0.19", features = ["cuda-13020"], optional = true }
log = "0.4.29"
pretty_env_logger = "0.5.0"

[build-dependencies]
prost-build = { version = "0.12", optional = true }

[dev-dependencies]
tokenizers = { version = "0.22" }
tempfile = "3.8"
half = "2.4"
safetensors = "0.7"
insta = { version = "1.47.2", features = ["yaml"] }
dirs = "6.0.0"
anyhow = "1.0.102"

[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3

[lib]
name = "rustnn"
crate-type = ["rlib"]
doctest = false

[[example]]
name = "smollm_mlcontext"
required-features = ["dynamic-inputs"]
