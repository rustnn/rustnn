language = "C"
pragma_once = true
cpp_compat = true

[enum]
prefix_with_name = true

[export]
item_types = ["enums", "structs", "opaque", "functions"]
exclude = [
    "rustnn_coreml_compile",
    "rustnn_coreml_load",
    "rustnn_coreml_predict",
]
include = [
    "RustnnStatus",
    "RustnnDataType",
    "RustnnPowerPreference",
    "RustnnUnaryOperation",
    "RustnnBinaryOperation",
    "RustnnOperandDescriptor",
    "RustnnTensorDescriptor",
    "RustnnOperand",
    "RustnnGraphBuilder",
    "RustnnContext",
    "RustnnGraph",
    "RustnnTensor",
    "RustnnNamedOperand",
    "RustnnNamedTensor",
    "RustnnContextOptions",
    "RustnnOperatorOptions",
]
