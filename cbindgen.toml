language = "C"
pragma_once = true
cpp_compat = true

[enum]
prefix_with_name = true

[export]
item_types = ["enums", "structs", "opaque", "functions"]
exclude = [
    "rustnn_coreml_compile",
    "rustnn_coreml_load",
    "rustnn_coreml_predict",
    "rustnn_coreml_array_view",
    "rustnn_coreml_predict_backed",
]
include = [
    "RustnnStatus",
    "RustnnDataType",
    "RustnnPowerPreference",
    "RustnnBackend",
    "RustnnDeviceType",
    "RustnnUnaryOperation",
    "RustnnBinaryOperation",
    "RustnnTernaryOperation",
    "RustnnOperandDescriptor",
    "RustnnTensorDescriptor",
    "RustnnOperand",
    "RustnnGraphBuilder",
    "RustnnContext",
    "RustnnGraph",
    "RustnnTensor",
    "RustnnNamedOperand",
    "RustnnNamedTensor",
    "RustnnBackendDevice",
    "RustnnTrtxOptions",
    "RustnnOptions",
    "RustnnContextOptions",
    "RustnnOperatorOptions",
]
